# MathUni Workflow Add New Lesson With Problems And Solutions

## Action

Follow the add-new-lesson-with-problems-and-solutions workflow:
1. Create or add the lesson HTML file in lessons/{module}/{unit}.html
2. Create or add the problem set markdown in problems/sets/{unit}.md
3. Create or add the solutions markdown in problems/solutions/{unit}.md

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: lessons/{module}/{unit}.html, problems/sets/{unit}.md, problems/solutions/{unit}.md

