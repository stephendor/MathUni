version: 1

semesters:
  - id: s1
    title: Rigour and machinery
  - id: s2
    title: Topology and modules
  - id: s3
    title: Algebraic topology and TDA I
  - id: s4
    title: Depth and research on-ramp

modules:
  - id: la
    title: Linear Algebra
    semester: s1
    primary_text: "Axler, Linear Algebra Done Right (Core Texts)"
    support: ["Oxford M1 Linear Algebra I/II notes"]
  - id: an
    title: Real Analysis I
    semester: s1
    primary_text: "Abbott, Understanding Analysis (Core Texts)"
    support: ["Brannan", "Oxford M2 Analysis I", "Spivak Calculus"]
  - id: aa
    title: Abstract Algebra
    semester: s1
    primary_text: "Aluffi, Algebra: Notes from the Underground — ch. 1-12 (Core Texts)"
    support: ["Carter, Visual Group Theory (visual layer, groups units only)",
              "Macauley VGT playlist (visual layer, groups units only)",
              "Oxford M1 Groups and Group Actions notes"]
  - id: pw
    title: Proof Workshop
    semester: s1
    primary_text: "Cummings, Proofs (Core Texts)"
    support: ["Schumacher, Chapter Zero", "Earl, Towards Higher Mathematics"]
  # Semester 2+ module stubs (units added in later phases)
  - id: top
    title: Point-Set Topology
    semester: s2
    primary_text: "Munkres, Topology (Core Texts)"
    support: ["Dexter Chua notes", "Conway", "McCleary"]
  # (Rings & Modules absorbed into the Semester-1 'aa' Abstract Algebra module.)
  - id: an2
    title: Analysis II
    semester: s2
    primary_text: "Oxford M2 Analysis II/III notes"
    support: []
  - id: lab
    title: Python for TDA Lab
    semester: s2
    primary_text: "Ripser/GUDHI/giotto-tda docs"
    support: []
  - id: at1
    title: Algebraic Topology I
    semester: s3
    primary_text: "Hatcher ch. 0-2"
    support: ["Dexter algebraic_topology notes", "Stillwell"]
  - id: cat
    title: Category Theory Essentials
    semester: s3
    primary_text: "Aluffi Chapter 0 (deepens the categorical thread built through aa)"
    support: ["Spivak, Applied Category Theory"]
  - id: tda1
    title: TDA I
    semester: s3
    primary_text: "Edelsbrunner-Harer"
    support: ["Oudot"]
  - id: at2
    title: Algebraic Topology II
    semester: s4
    primary_text: "Hatcher ch. 3"
    support: ["Dexter algebraic_topology_iii notes"]
  - id: tda2
    title: TDA II
    semester: s4
    primary_text: "Dey-Wang"
    support: ["Ghrist, Elementary Applied Topology"]
  - id: cap
    title: Capstone
    semester: s4
    primary_text: "TDL project"
    support: []

units:
  # ---- Proof Workshop (woven strand; light prereqs, unlocks early) ----
  - id: pw-01
    module: pw
    title: "Direct proof, contrapositive, contradiction"
    prereqs: []
    resources: ["Cummings ch. 2, 6-7"]
    hook: "Three ways to corner a truth — and how mathematicians pick locks."
    mission_link: "Every TDA paper you'll verify is built from these moves."
  - id: pw-02
    module: pw
    title: "Induction, strong induction, well-ordering"
    prereqs: ["pw-01"]
    resources: ["Cummings ch. 4"]
    hook: "Dominoes, but the row is infinite and you get to shove the first one."
    mission_link: "Simplicial complex arguments induct on dimension constantly."
  - id: pw-03
    module: pw
    title: "Sets, functions, images and preimages, done rigorously"
    prereqs: ["pw-01"]
    resources: ["Cummings ch. 3, 8", "Schumacher"]
    hook: "f(A ∩ B) ≠ f(A) ∩ f(B): the inequality that catches everyone once."
    mission_link: "Continuity in topology is defined entirely via preimages."
  - id: pw-04
    module: pw
    title: "Epsilon-delta craft"
    prereqs: ["pw-03", "an-03"]
    resources: ["Cummings Real Analysis ch. 1-2", "Abbott 2.2"]
    hook: "The adversarial game: they pick epsilon, you must always win."
    mission_link: "Stability of persistence diagrams is an epsilon statement."
  - id: pw-05
    module: pw
    title: "Proof style: writing and critiquing"
    prereqs: ["pw-02", "pw-03"]
    resources: ["Cummings appendix", "Expository Writing folder"]
    hook: "Grade a deliberately flawed proof — find all five planted errors."
    mission_link: "The capstone is written mathematics; style is substance."

  # ---- Linear Algebra (Axler LADR) ----
  - id: la-01
    module: la
    title: "Vector spaces"
    prereqs: []
    resources: ["Axler 1A-1B"]
    hook: "Polynomials, sequences, and functions are all secretly the same thing."
    mission_link: "Homology groups over a field are vector spaces — this is their home."
  - id: la-02
    module: la
    title: "Subspaces, sums, direct sums"
    prereqs: ["la-01"]
    resources: ["Axler 1C"]
    hook: "When does a plane plus a line fill space? Direct sums as jigsaw pieces."
    mission_link: "Cycles and boundaries sit inside chains as subspaces."
  - id: la-03
    module: la
    title: "Span and linear independence"
    prereqs: ["la-02"]
    resources: ["Axler 2A"]
    hook: "Redundancy detection: which vectors are freeloaders?"
    mission_link: "Betti numbers count independent cycles — independence is the point."
  - id: la-04
    module: la
    title: "Bases and dimension"
    prereqs: ["la-03"]
    resources: ["Axler 2B-2C"]
    hook: "Why every basis of the same space has the same size — a genuinely deep fact."
    mission_link: "dim(ker ∂)/im ∂ computations are how Betti numbers are actually found."
  - id: la-05
    module: la
    title: "Linear maps"
    prereqs: ["la-04"]
    resources: ["Axler 3A"]
    hook: "The only functions algebra truly loves — and why derivatives qualify."
    mission_link: "Boundary operators ∂ are linear maps; homology is their study."
  - id: la-06
    module: la
    title: "Null space, range, fundamental theorem"
    prereqs: ["la-05"]
    resources: ["Axler 3B"]
    hook: "Conservation law for dimensions: nothing is created or destroyed."
    mission_link: "Homology literally = null space of one map modulo range of another."
  - id: la-07
    module: la
    title: "Matrices as linear maps"
    prereqs: ["la-06"]
    resources: ["Axler 3C"]
    hook: "Matrices are the shadows linear maps cast once you pick a basis."
    mission_link: "Persistence software reduces boundary matrices — this is that bridge."
  - id: la-08
    module: la
    title: "Invertibility and isomorphism"
    prereqs: ["la-07"]
    resources: ["Axler 3D"]
    hook: "When are two vector spaces 'the same'? The first taste of isomorphism."
    mission_link: "Functoriality sends isomorphisms to isomorphisms — the habit starts here."
  - id: la-09
    module: la
    title: "Products and quotient spaces"
    prereqs: ["la-08"]
    resources: ["Axler 3E"]
    hook: "Collapse a subspace to zero and see what survives."
    mission_link: "H = Z/B is a quotient. This unit is homology in miniature."
  - id: la-10
    module: la
    title: "Duality"
    prereqs: ["la-09"]
    resources: ["Axler 3F"]
    hook: "Every space has a mirror world of measurements."
    mission_link: "Cohomology is homology's dual; persistent cohomology runs faster."
  - id: la-11
    module: la
    title: "Eigenvalues, eigenvectors, invariant subspaces"
    prereqs: ["la-08"]
    resources: ["Axler 5A"]
    hook: "Directions a transformation cannot bend, only stretch."
    mission_link: "Spectral methods appear in Mapper and graph-based TDA."
  - id: la-12
    module: la
    title: "Minimal polynomial and diagonalisability"
    prereqs: ["la-11"]
    resources: ["Axler 5B-5C"]
    hook: "One polynomial that knows everything about your operator."
    mission_link: "Structure theorems here foreshadow persistence module decomposition."
  - id: la-13
    module: la
    title: "Inner product spaces"
    prereqs: ["la-04"]
    resources: ["Axler 6A"]
    hook: "Geometry enters: length and angle from pure algebra."
    mission_link: "Point clouds live in inner product spaces; distances build filtrations."
  - id: la-14
    module: la
    title: "Orthonormal bases and Gram-Schmidt"
    prereqs: ["la-13"]
    resources: ["Axler 6B"]
    hook: "Straightening a skewed coordinate system, one vector at a time."
    mission_link: "PCA preprocessing before TDA pipelines is this machinery."
  - id: la-15
    module: la
    title: "Spectral theorem (real case)"
    prereqs: ["la-12", "la-14"]
    resources: ["Axler 7A-7B"]
    hook: "The crown jewel: symmetric operators diagonalise perfectly. Why?"
    mission_link: "Graph Laplacians in Mapper are symmetric — their spectra behave."

  # ---- Real Analysis I (Abbott) ----
  - id: an-01
    module: an
    title: "Reals, completeness, sup and inf"
    prereqs: []
    resources: ["Abbott 1.1-1.4"]
    hook: "√2 punched a hole in the rationals; completeness is the patch."
    mission_link: "Persistence values are reals; inf/sup define birth and death."
  - id: an-02
    module: an
    title: "Cardinality and Cantor's diagonal"
    prereqs: ["an-01"]
    resources: ["Abbott 1.5-1.6", "Stillwell, Roads to Infinity"]
    hook: "Some infinities are bigger than others — provably."
    mission_link: "Countability arguments recur in measure-free TDA foundations."
  - id: an-03
    module: an
    title: "Sequences and limits"
    prereqs: ["an-01"]
    resources: ["Abbott 2.2-2.3"]
    hook: "Make 'gets close to' bulletproof against every adversary."
    mission_link: "Convergence of persistence diagrams needs limits done right."
  - id: an-04
    module: an
    title: "Monotone convergence and Bolzano-Weierstrass"
    prereqs: ["an-03"]
    resources: ["Abbott 2.4-2.5"]
    hook: "Bounded sequences can't escape: something must accumulate."
    mission_link: "Compactness arguments in stability proofs start here."
  - id: an-05
    module: an
    title: "Cauchy sequences and completeness"
    prereqs: ["an-04"]
    resources: ["Abbott 2.6"]
    hook: "Convergence without knowing the destination."
    mission_link: "The space of persistence diagrams is complete — same criterion."
  - id: an-06
    module: an
    title: "Infinite series"
    prereqs: ["an-05"]
    resources: ["Abbott 2.7"]
    hook: "Rearrange a series, change its sum: conditional convergence is wild."
    mission_link: "Rigour training; series estimates appear in vectorisation methods."
  - id: an-07
    module: an
    title: "Open and closed sets in R"
    prereqs: ["an-03"]
    resources: ["Abbott 3.2"]
    hook: "The vocabulary the whole of topology is built from."
    mission_link: "Direct on-ramp to Semester 2's point-set topology."
  - id: an-08
    module: an
    title: "Compactness and Heine-Borel"
    prereqs: ["an-07", "an-04"]
    resources: ["Abbott 3.3"]
    hook: "The property that makes infinite behave like finite."
    mission_link: "Compact metric spaces are where TDA's theory lives."
  - id: an-09
    module: an
    title: "Connectedness and the Cantor set"
    prereqs: ["an-08"]
    resources: ["Abbott 3.4, 3.1"]
    hook: "A set with zero length and uncountably many points."
    mission_link: "Connected components are H0 — the first Betti story."
  - id: an-10
    module: an
    title: "Functional limits and continuity"
    prereqs: ["an-07", "pw-04"]
    resources: ["Abbott 4.2-4.3"]
    hook: "Continuity recast: preimages of open sets are open. Remember pw-03?"
    mission_link: "This definition, verbatim, is the one topology keeps."
  - id: an-11
    module: an
    title: "Continuity on compact sets; IVT and EVT"
    prereqs: ["an-10", "an-08"]
    resources: ["Abbott 4.4-4.5"]
    hook: "Why continuous images of compact sets can't misbehave."
    mission_link: "Filtration functions on compact spaces attain their bounds."
  - id: an-12
    module: an
    title: "The derivative and the Mean Value Theorem"
    prereqs: ["an-10"]
    resources: ["Abbott 5.2-5.3"]
    hook: "MVT: the theorem that quietly proves half of calculus."
    mission_link: "Morse-theoretic TDA needs derivatives treated honestly."
  - id: an-13
    module: an
    title: "Uniform convergence"
    prereqs: ["an-06", "an-10"]
    resources: ["Abbott 6.2"]
    hook: "When limits of nice functions go wrong — and the fix."
    mission_link: "Uniform (sup-norm) bounds are the language of the stability theorem."
  - id: an-14
    module: an
    title: "Metric spaces bridge"
    prereqs: ["an-08", "an-10"]
    resources: ["Abbott 8.2 (or equiv.)", "Oxford M2 notes"]
    hook: "Everything you just proved for R, replayed on any set with a distance."
    mission_link: "Point clouds, diagram space, bottleneck distance: all metric spaces."

  # ---- Abstract Algebra (Aluffi Underground ch. 1-12; rings -> modules -> groups) ----
  # Optional motivation aside (ungated); the spine proper starts at aa-01.
  - id: aa-00
    module: aa
    title: "Symmetry: groups before the definition (optional)"
    prereqs: []
    resources: ["Carter ch. 1-2", "Macauley VGT lecture 1"]
    hook: "A rectangle, a light switch, and a dance move walk into a bar — same group."
    mission_link: "Optional on-ramp: structure abstracted from examples, the move algebra makes over and over."

  # -- Rings (Underground Part I, ch. 1-7) --
  - id: aa-01
    module: aa
    title: "Integers: well-ordering, induction, division"
    prereqs: ["pw-01"]
    resources: ["Aluffi Underground 1.1-1.2"]
    hook: "The integers you've known since childhood, re-introduced as strangers with axioms."
    mission_link: "Z is the first ring, and the ground every chain complex is built over."
  - id: aa-02
    module: aa
    title: "GCD, Bezout, and the Fundamental Theorem of Arithmetic"
    prereqs: ["aa-01"]
    resources: ["Aluffi Underground 1.3-1.4"]
    hook: "Why is 1 = 3*5 - 2*7? Bezout says every gcd is a hidden combination."
    mission_link: "Unique factorisation is the template for every 'decompose into irreducibles' theorem ahead."
  - id: aa-03
    module: aa
    title: "Equivalence relations, quotients, and Z/nZ"
    prereqs: ["aa-02", "pw-03"]
    resources: ["Aluffi Underground 2.1-2.2"]
    hook: "Glue every multiple of 12 into a single point and a clock falls out."
    mission_link: "Your very first quotient — the construction homology is built from, rehearsed on integers."
  - id: aa-04
    module: aa
    title: "Arithmetic in Z/nZ; Fermat's little theorem and RSA"
    prereqs: ["aa-03"]
    resources: ["Aluffi Underground 2.3-2.5"]
    hook: "Do arithmetic where 7 + 7 = 2, then watch it encrypt the internet."
    mission_link: "Finite rings are the coefficient worlds Z/2, Z/p that TDA computes homology over."
  - id: aa-05
    module: aa
    title: "Rings: definition, examples, basic properties"
    prereqs: ["aa-04"]
    resources: ["Aluffi Underground 3.1-3.2"]
    hook: "One structure that holds the integers, polynomials, matrices, and functions all at once."
    mission_link: "Coefficients for homology come from a ring; everything downstream lives here."
  - id: aa-06
    module: aa
    title: "Domains, fields, and zero-divisors"
    prereqs: ["aa-05"]
    resources: ["Aluffi Underground 3.3"]
    hook: "In some rings two nonzero things multiply to zero. That single defect reshapes everything."
    mission_link: "Field coefficients make homology a vector space; over a ring you keep torsion. This is that fork."
  - id: aa-07
    module: aa
    title: "The category of rings I: products and subrings"
    prereqs: ["aa-06"]
    resources: ["Aluffi Underground 4.1-4.2"]
    hook: "Stop studying rings one at a time; study the arrows between all of them."
    mission_link: "The categorical habit — objects plus structure-preserving maps — that persistence lives inside."
  - id: aa-08
    module: aa
    title: "Ring homomorphisms and isomorphisms"
    prereqs: ["aa-07"]
    resources: ["Aluffi Underground 4.3-4.4"]
    hook: "The only maps a ring respects — and when two rings are secretly identical."
    mission_link: "Induced maps on homology are homomorphisms; functoriality is born here."
  - id: aa-09
    module: aa
    title: "Kernels, ideals, and quotient rings"
    prereqs: ["aa-08"]
    resources: ["Aluffi Underground 5.1-5.3"]
    hook: "Collapse an ideal to zero and a brand-new ring survives the fall. (Compare la-09.)"
    mission_link: "Kernel-mod-image, made concrete for rings — the exact shape of a homology group."
  - id: aa-10
    module: aa
    title: "Isomorphism theorems for rings; the Chinese Remainder Theorem"
    prereqs: ["aa-09"]
    resources: ["Aluffi Underground 5.4-5.7"]
    hook: "One diagram — kernel, image, quotient — that you will now see everywhere for the rest of your life."
    mission_link: "First pass at the isomorphism theorems, the engine of every homology computation."
  - id: aa-11
    module: aa
    title: "Prime and maximal ideals; primes vs irreducibles"
    prereqs: ["aa-10"]
    resources: ["Aluffi Underground 6.1-6.2"]
    hook: "Which ideals behave like prime numbers? The answer builds a geometry out of algebra."
    mission_link: "Primes and maximals are the points of the spectrum — algebra's first bridge back to space."
  - id: aa-12
    module: aa
    title: "Euclidean domains, PIDs, UFDs; field of fractions"
    prereqs: ["aa-11"]
    resources: ["Aluffi Underground 6.3-6.5"]
    hook: "Rank rings by how much of the integers' good behaviour they keep — one chain of acronyms."
    mission_link: "'Principal ideal domain' is the exact hypothesis the persistence structure theorem will demand."
  - id: aa-13
    module: aa
    title: "Polynomial rings over a field"
    prereqs: ["aa-12"]
    resources: ["Aluffi Underground 7.1-7.2"]
    hook: "k[x]: the ring that behaves almost exactly like the integers, long division and all."
    mission_link: "A persistence module is formally a graded module over k[x] — this is that ring."
  - id: aa-14
    module: aa
    title: "Irreducibility and factorization in Q[x], Z[x]"
    prereqs: ["aa-13"]
    resources: ["Aluffi Underground 7.3-7.5"]
    hook: "Is x^4 + 1 secretly a product? Eisenstein hands you a one-line lie detector."
    mission_link: "Rigour and technique; the factorisation habits carry straight into module decomposition."

  # -- Modules (Underground Part II, ch. 8-9) --
  - id: aa-15
    module: aa
    title: "Modules and the category of R-modules"
    prereqs: ["aa-14", "la-05"]
    resources: ["Aluffi Underground 8.1-8.2"]
    hook: "Take a vector space and let the scalars be any ring. Almost nothing — and everything — changes."
    mission_link: "Homology's true home: chain groups are modules, not merely vector spaces."
  - id: aa-16
    module: aa
    title: "Submodules, direct sums, and quotient modules"
    prereqs: ["aa-15"]
    resources: ["Aluffi Underground 8.3-8.4"]
    hook: "Quotients again — but this is the exact move, cycles mod boundaries, that defines a homology group."
    mission_link: "Z/B is a quotient module. This unit is homology, one abstraction early."
  - id: aa-17
    module: aa
    title: "Isomorphism theorems for modules"
    prereqs: ["aa-16"]
    resources: ["Aluffi Underground 8.5"]
    hook: "The same three theorems, a category deeper — and the exact version homology uses."
    mission_link: "Second pass at the iso theorems; these are the identities behind every Betti computation."
  - id: aa-18
    module: aa
    title: "Free modules; modules from matrices"
    prereqs: ["aa-17"]
    resources: ["Aluffi Underground 9.1-9.2"]
    hook: "When does a module have a basis? And what a matrix is really presenting."
    mission_link: "Boundary matrices present the chain modules; reducing them is persistence computation."
  - id: aa-19
    module: aa
    title: "Finitely generated vs finitely presented modules"
    prereqs: ["aa-18"]
    resources: ["Aluffi Underground 9.3-9.4"]
    hook: "Generators and relations: describe an infinite object with a finite blueprint."
    mission_link: "A finite presentation is exactly what a computer stores to compute homology."
  - id: aa-20
    module: aa
    title: "Structure theorem: finitely generated modules over a PID"
    prereqs: ["aa-19", "la-07"]
    resources: ["Aluffi Underground 9.5-9.6"]
    hook: "One theorem shatters every f.g. module into free part plus torsion — cleanly, and uniquely."
    mission_link: "This IS the barcode: persistence modules decompose into intervals by exactly this theorem."

  # -- Abelian groups (Underground ch. 10) --
  - id: aa-21
    module: aa
    title: "Abelian groups as Z-modules; cyclic groups and orders"
    prereqs: ["aa-20"]
    resources: ["Aluffi Underground 10.1-10.2"]
    hook: "Every abelian group is secretly a Z-module — so you already proved most of this last unit."
    mission_link: "H0 and torsion in homology are finitely generated abelian groups; this is how you read them."
  - id: aa-22
    module: aa
    title: "Classification of finitely generated abelian groups"
    prereqs: ["aa-21"]
    resources: ["Aluffi Underground 10.3-10.4"]
    hook: "A complete periodic table: every f.g. abelian group, named, with no exceptions."
    mission_link: "Free rank (Betti numbers) plus torsion coefficients — the full content of an integral homology group."

  # -- Groups (Underground Part III, ch. 11-12; visual layer returns) --
  - id: aa-23
    module: aa
    title: "Groups and their category: subgroups and homomorphisms"
    prereqs: ["aa-22"]
    resources: ["Aluffi Underground 11.1", "Carter ch. 1-2", "Macauley VGT lecture 1-2"]
    hook: "Drop commutativity and the world turns wilder — symmetry in its full non-abelian glory. (Remember aa-00's rectangle?)"
    mission_link: "Fundamental groups and covering-space deck transformations are non-abelian; this is their grammar."
  - id: aa-24
    module: aa
    title: "Group actions"
    prereqs: ["aa-23"]
    resources: ["Aluffi Underground 11.2", "Oxford M1 Groups and Group Actions"]
    hook: "Groups don't just sit there — they DO things to sets, and the doing is where the theorems hide."
    mission_link: "Covering space theory (Semester 3) is a group acting on a space; deck groups are actions."
  - id: aa-25
    module: aa
    title: "Cyclic, dihedral, symmetric, and free groups"
    prereqs: ["aa-24"]
    resources: ["Aluffi Underground 11.3", "Carter ch. 2-3", "Macauley VGT lectures 2-3"]
    hook: "The zoo: clocks, mirror symmetries, shuffles — and the wildest of all, the free group."
    mission_link: "Free groups are literally the fundamental groups of graphs; symmetric-group signs orient simplices."
  - id: aa-26
    module: aa
    title: "Normality and quotient groups"
    prereqs: ["aa-25"]
    resources: ["Aluffi Underground 11.4"]
    hook: "Which subgroups can you divide by? The quotient move in its non-abelian final form. (Compare aa-09, aa-16.)"
    mission_link: "Hn is a quotient group; the third and deepest rehearsal of homology's defining construction."
  - id: aa-27
    module: aa
    title: "Isomorphism theorems for groups"
    prereqs: ["aa-26"]
    resources: ["Aluffi Underground 11.5"]
    hook: "Third pass, three categories deep — rings, modules, groups — one lattice that always folds the same way."
    mission_link: "The version used silently in every homology and fundamental-group computation you will read."
  - id: aa-28
    module: aa
    title: "Lagrange's theorem and the class equation"
    prereqs: ["aa-27"]
    resources: ["Aluffi Underground 12.1-12.2"]
    hook: "Count a group by tiling it with copies of a subgroup — and counting suddenly proves structure."
    mission_link: "Counting arguments recur in covering-space degrees and orbit decompositions."
  - id: aa-29
    module: aa
    title: "Classification, simplicity, and Sylow's theorems"
    prereqs: ["aa-28"]
    resources: ["Aluffi Underground 12.3-12.5"]
    hook: "Prime factorisation for groups: Sylow's theorems pull p-subgroups out of thin air."
    mission_link: "The deep structural payoff — how a finite symmetry group is actually taken apart."
  - id: aa-30
    module: aa
    title: "Simplicity of A_n and solvable groups"
    prereqs: ["aa-29"]
    resources: ["Aluffi Underground 12.6-12.7"]
    hook: "Why you cannot solve the quintic by radicals — a group-theoretic murder mystery, solved."
    mission_link: "Capstone of the algebra arc; solvable and simple groups close the Underground's group story."

  # ==== SEMESTER 2 ========================================================

  # ---- Point-Set Topology (Munkres; quotient-heavy, climaxing in cell complexes) ----
  # Linear spine top-01..top-13; cross-links into the analysis strand at 01/06/08.
  # Urysohn/Tietze/metrization (Munkres §33-35) are out of scope for the mission.
  - id: top-01
    module: top
    title: "Topological spaces and open sets"
    prereqs: ["an-07"]
    resources: ["Munkres §12"]
    hook: "Forget distance. Keep only which sets are open — and almost all of analysis still works."
    mission_link: "A topology is the minimal structure on which continuity, and therefore homology, can be defined."
  - id: top-02
    module: top
    title: "Basis, order, and subspace topologies"
    prereqs: ["top-01"]
    resources: ["Munkres §13, §14, §16"]
    hook: "You can't list every open set by hand — so name a basis and let it generate the rest."
    mission_link: "The subspace topology is how sampled data inherits structure from the space it sits inside."
  - id: top-03
    module: top
    title: "Closed sets, closure, interior, and limit points"
    prereqs: ["top-02"]
    resources: ["Munkres §17"]
    hook: "The closure adds exactly the points you can sneak up on — the boundary made precise."
    mission_link: "Limit points and closure are the raw material of the connectedness and compactness proofs ahead."
  - id: top-04
    module: top
    title: "Continuous functions and homeomorphisms"
    prereqs: ["top-03"]
    resources: ["Munkres §18"]
    hook: "Continuity with no epsilons: preimages of open sets are open. (You proved this shape in an-10.)"
    mission_link: "A homeomorphism is topology's notion of 'same shape' — the equivalence TDA measures everything against."
  - id: top-05
    module: top
    title: "The product topology"
    prereqs: ["top-04"]
    resources: ["Munkres §15, §19"]
    hook: "Infinitely many spaces, one product — and the obvious box topology is the wrong answer. Why?"
    mission_link: "Product spaces model multi-parameter data; this subtlety returns in multiparameter persistence."
  - id: top-06
    module: top
    title: "The metric topology"
    prereqs: ["top-05", "an-14"]
    resources: ["Munkres §20, §21"]
    hook: "Every metric space is a topological space — so all of an-14 was secretly topology already."
    mission_link: "Point clouds are metric spaces; this is the bridge from their distances to their topology."
  - id: top-07
    module: top
    title: "Connectedness and components"
    prereqs: ["top-06"]
    resources: ["Munkres §23, §24, §25"]
    hook: "Can you walk between any two points without leaving the set? Counting the pieces is H0."
    mission_link: "Connected components ARE zeroth homology — the first and most robust Betti number."
  - id: top-08
    module: top
    title: "Compactness"
    prereqs: ["top-07", "an-08"]
    resources: ["Munkres §26, §27"]
    hook: "Every open cover has a finite subcover — the property that tames the infinite, now off the real line."
    mission_link: "TDA's theory lives on compact spaces; filtrations of compact data are where the theorems hold."
  - id: top-09
    module: top
    title: "Limit-point and local compactness"
    prereqs: ["top-08"]
    resources: ["Munkres §28, §29"]
    hook: "Three flavours of compactness — and when the neighbourhood, not the whole space, is what behaves finitely."
    mission_link: "Local compactness underwrites the well-behaved spaces (manifolds) that real data is sampled from."
  - id: top-10
    module: top
    title: "The countability axioms"
    prereqs: ["top-09"]
    resources: ["Munkres §30"]
    hook: "How small is your space's basis? Second-countability quietly powers half the metrization results."
    mission_link: "Countability separates the pathological spaces from the ones data can actually sample."
  - id: top-11
    module: top
    title: "Separation axioms and normal spaces"
    prereqs: ["top-10"]
    resources: ["Munkres §31, §32"]
    hook: "Can points be told apart by open sets? Hausdorff and beyond — a ladder of how polite a space is."
    mission_link: "Hausdorffness is the sanity axiom persistence diagrams and their limits silently assume."
  - id: top-12
    module: top
    title: "The quotient topology"
    prereqs: ["top-11"]
    resources: ["Munkres §22"]
    hook: "Glue the edges of a square and a torus falls out — the construction algebraic topology is built on. (Compare la-09, aa-09, aa-16.)"
    mission_link: "Quotients build every cell complex; the fourth and most geometric rehearsal of the collapse move."
  - id: top-13
    module: top
    title: "Quotient constructions: cones, suspension, CW complexes"
    prereqs: ["top-12"]
    resources: ["Munkres §22 (constructions)", "Hatcher ch. 0"]
    hook: "Cone a space to a point, suspend it, or build it cell by cell — the Lego kit of algebraic topology."
    mission_link: "CW complexes are exactly the spaces whose homology a computer can compute — the on-ramp to at1 and the lab."

  # ---- Analysis II (Oxford M2; metric spaces, uniform convergence, Banach spaces) ----
  # Linear spine an2-01..an2-09; cross-links into an (analysis I) and la.
  - id: an2-01
    module: an2
    title: "Metric-space topology, deepened"
    prereqs: ["an-14"]
    resources: ["Oxford M2 Metric Spaces notes", "Abbott 8.2 (or equiv.)"]
    hook: "Open balls, Cauchy sequences, continuity — replayed on any metric space until it is second nature."
    mission_link: "The space of persistence diagrams is a metric space; fluency here is fluency there."
  - id: an2-02
    module: an2
    title: "Completeness and completion"
    prereqs: ["an2-01", "an-05"]
    resources: ["Oxford M2 Metric Spaces notes"]
    hook: "Fill every hole a Cauchy sequence points at — and turn Q into R for any space at all."
    mission_link: "Diagram space is complete; completeness is what lets limits of diagrams exist to be proven stable."
  - id: an2-03
    module: an2
    title: "Compactness: sequential, total boundedness, Arzela-Ascoli"
    prereqs: ["an2-02"]
    resources: ["Oxford M2 Metric Spaces notes"]
    hook: "When does every sequence have a convergent subsequence? Arzela-Ascoli answers it for whole families of functions."
    mission_link: "Compactness of diagram and function spaces is the engine behind existence proofs in stability theory."
  - id: an2-04
    module: an2
    title: "The contraction mapping theorem and applications"
    prereqs: ["an2-03"]
    resources: ["Oxford M2 Metric Spaces notes"]
    hook: "One inequality guarantees a unique fixed point — and hands you existence theorems for ODEs for free."
    mission_link: "Fixed-point arguments recur wherever an algorithm's convergence must be proven, not merely hoped."
  - id: an2-05
    module: an2
    title: "Uniform convergence of derivatives and integrals"
    prereqs: ["an2-04", "an-13"]
    resources: ["Abbott 6.2-6.3", "Oxford M2 Analysis III notes"]
    hook: "When can you swap limit and integral? Pointwise convergence lies; uniform convergence doesn't. (Recall an-13.)"
    mission_link: "Sup-norm (uniform) control is the exact language the persistence stability theorem is written in."
  - id: an2-06
    module: an2
    title: "Series of functions; the Weierstrass M-test and approximation"
    prereqs: ["an2-05", "an-06"]
    resources: ["Abbott 6.4-6.7", "Oxford M2 Analysis III notes"]
    hook: "Add infinitely many functions safely — then approximate ANY continuous function by polynomials."
    mission_link: "Uniform approximation justifies discretising a continuous signal before you compute its topology."
  - id: an2-07
    module: an2
    title: "Normed and Banach spaces"
    prereqs: ["an2-06", "la-01"]
    resources: ["Oxford M2 Analysis III notes"]
    hook: "Give a vector space a length and complete it — where analysis and linear algebra finally merge."
    mission_link: "Feature spaces for vectorised diagrams are normed spaces; kernels live in complete (Banach) ones."
  - id: an2-08
    module: an2
    title: "Function spaces: C[a,b]"
    prereqs: ["an2-07"]
    resources: ["Oxford M2 Analysis III notes"]
    hook: "The continuous functions on an interval form a single infinite-dimensional space — with its own geometry."
    mission_link: "Filtration functions live in C(X); treating a whole space of functions as one object is the key move."
  - id: an2-09
    module: an2
    title: "Differentiation in R^n"
    prereqs: ["an2-08", "la-05", "la-06"]
    resources: ["Oxford M2 notes (multivariable analysis)"]
    hook: "The derivative is not a number but a linear map — the best linear approximation, made rigorous. (See la-05.)"
    mission_link: "Morse theory and gradient-based filtrations need the multivariable derivative treated honestly."

  # ---- Python for TDA Lab (Ripser/GUDHI/giotto-tda; the applied strand) ----
  # Linear spine lab-01..lab-09; cross-links carry in the la/aa/pw/an2 machinery each step needs.
  - id: lab-01
    module: lab
    title: "Setup and point clouds"
    prereqs: ["la-01", "an-14"]
    resources: ["giotto-tda: point-cloud tutorials", "GUDHI install docs"]
    hook: "Install the toolkit, sample a noisy circle, and see the hole you're about to detect — before any theory."
    mission_link: "A point cloud is a finite metric space; every pipeline in this lab starts exactly here."
  - id: lab-02
    module: lab
    title: "Simplicial complexes: Vietoris-Rips and Cech"
    prereqs: ["lab-01"]
    resources: ["GUDHI: RipsComplex & AlphaComplex tutorials", "Edelsbrunner ch. III"]
    hook: "Connect points closer than a threshold and a shape condenses out of the dust — the filtration begins."
    mission_link: "Vietoris-Rips and Cech complexes are how raw points become something with computable homology."
  - id: lab-03
    module: lab
    title: "Computing persistence; boundary-matrix reduction"
    prereqs: ["lab-02", "la-07", "aa-18"]
    resources: ["Ripser docs", "Edelsbrunner ch. VII", "Otter et al., A roadmap for computing persistent homology"]
    hook: "Persistence is one matrix reduction over Z/2 — watch the algorithm from la-07 pull the holes out."
    mission_link: "The computational heart: reducing boundary matrices IS computing homology (aa-18 made runnable)."
  - id: lab-04
    module: lab
    title: "Persistence diagrams and barcodes"
    prereqs: ["lab-03", "aa-20"]
    resources: ["giotto-tda: persistence diagrams", "Oudot ch. 1"]
    hook: "Every hole gets a birth and a death — plot them and the structure theorem's intervals appear on screen."
    mission_link: "The barcode is aa-20's decomposition made visible; this is the mission's central object."
  - id: lab-05
    module: lab
    title: "Bottleneck and Wasserstein distance; stability"
    prereqs: ["lab-04", "pw-04", "an2-03"]
    resources: ["persim: bottleneck & Wasserstein", "Oudot ch. 3"]
    hook: "Perturb the data a little, the diagram moves a little — measure exactly how much, and prove it can't move more."
    mission_link: "The stability theorem (an epsilon statement, cf. pw-04) is why TDA is trustworthy on noisy real data."
  - id: lab-06
    module: lab
    title: "Vectorising diagrams: persistence images, landscapes, Betti curves"
    prereqs: ["lab-05"]
    resources: ["giotto-tda: diagram vectorisation", "scikit-tda persim (images, landscapes)"]
    hook: "Diagrams are not vectors — so turn them into vectors, carefully, without throwing the topology away."
    mission_link: "Vectorisation is the bridge that lets a machine-learning model consume a persistence diagram."
  - id: lab-07
    module: lab
    title: "TDA in machine-learning pipelines"
    prereqs: ["lab-06"]
    resources: ["giotto-tda: Pipeline API", "scikit-learn Pipeline docs"]
    hook: "Bolt persistence onto a scikit-learn pipeline and let topology become one more feature the model sees."
    mission_link: "End-to-end pipelines are how TDA earns its keep in an actual data-analysis project."
  - id: lab-08
    module: lab
    title: "Mapper"
    prereqs: ["lab-07", "la-15"]
    resources: ["giotto-tda: Mapper", "Kepler-Mapper docs", "Singh-Memoli-Carlsson, Mapper (2007)"]
    hook: "Cover, cluster, connect — Mapper squeezes a high-dimensional dataset into a graph you can actually look at."
    mission_link: "Mapper's graph is a topological summary; its clustering leans on la-15's spectral machinery."
  - id: lab-09
    module: lab
    title: "Mini-project: a full TDA analysis"
    prereqs: ["lab-08"]
    resources: ["giotto-tda examples gallery", "self-directed dataset"]
    hook: "One dataset, end to end: point cloud, complex, persistence, features, conclusion. Your first real result."
    mission_link: "A dry run of the capstone — the whole pipeline, on data you choose, defended in writing."

  # ==== SEMESTER 3 ========================================================

  # ---- Algebraic Topology I (Hatcher ch. 0-2; the fundamental group, then homology) ----
  # Section pins verified against the Hatcher TOC on disk (ch.0, 1.1-1.3, 2.1-2.3).
  # Cross-links cash in the aa groups/modules machinery and the S2 topology.
  - id: at1-01
    module: at1
    title: "Homotopy, homotopy equivalence, and deformation retracts"
    prereqs: ["top-04", "top-13"]
    resources: ["Hatcher ch. 0"]
    hook: "A coffee mug and a doughnut, made rigorous: when is 'continuously deform' an actual theorem?"
    mission_link: "Homology is a homotopy invariant — that invariance is exactly why topological features survive noise."
  - id: at1-02
    module: at1
    title: "CW complexes and operations on spaces"
    prereqs: ["at1-01", "top-13"]
    resources: ["Hatcher ch. 0"]
    hook: "Build any space from cells, one dimension at a time — the data structure algebraic topology actually computes on."
    mission_link: "A CW structure turns a space into chain groups a persistence algorithm can chew: cells become generators."
  - id: at1-03
    module: at1
    title: "The fundamental group"
    prereqs: ["at1-02", "aa-23"]
    resources: ["Hatcher 1.1", "Dexter algebraic_topology notes"]
    hook: "Loops you can't shrink detect holes you can't see — and they compose into a group. (aa-23's groups, geometrised.)"
    mission_link: "Pi_1 is the first algebraic invariant of shape; H_1 is its abelianisation — the Betti-1 you will compute."
  - id: at1-04
    module: at1
    title: "The fundamental group of the circle and applications"
    prereqs: ["at1-03"]
    resources: ["Hatcher 1.1", "Stillwell"]
    hook: "Pi_1(S^1) = Z: winding number is a theorem, and it proves Brouwer's fixed point and the fundamental theorem of algebra."
    mission_link: "The first nontrivial computation — a hole detected algebraically, the template for all of persistent H_1."
  - id: at1-05
    module: at1
    title: "Van Kampen's theorem"
    prereqs: ["at1-04", "aa-25", "aa-26"]
    resources: ["Hatcher 1.2"]
    hook: "Cut a space into pieces, know each piece's loops, glue the groups back — free products with amalgamation (aa-25 arrives)."
    mission_link: "Local-to-global: the same 'assemble from pieces' logic Mayer-Vietoris and the nerve theorem later run on."
  - id: at1-06
    module: at1
    title: "Covering spaces"
    prereqs: ["at1-05", "aa-24"]
    resources: ["Hatcher 1.3"]
    hook: "Unroll the circle onto the real line and pi_1 becomes a group ACTING on the cover — aa-24's actions, geometrised."
    mission_link: "Covering-space theory is pi_1 as a group action (deck transformations) — the deepest tie from aa's groups to space."
  - id: at1-07
    module: at1
    title: "Simplicial and singular homology"
    prereqs: ["at1-02", "aa-17", "la-09"]
    resources: ["Hatcher 2.1", "Dexter algebraic_topology notes"]
    hook: "Cycles modulo boundaries, at last, in full generality — the quotient move of aa-17 and la-09 becomes H_n."
    mission_link: "This is homology proper: H_n = ker d_n / im d_(n+1), the object every persistence computation tracks."
  - id: at1-08
    module: at1
    title: "Cellular homology and degree"
    prereqs: ["at1-07", "aa-22"]
    resources: ["Hatcher 2.2"]
    hook: "Compute H_n of a CW complex from a tiny chain of cells — and read Betti numbers straight off (aa-22 pays out)."
    mission_link: "Cellular homology is the hand-computable engine; Betti numbers are free ranks, exactly aa-22's invariants."
  - id: at1-09
    module: at1
    title: "Exact sequences: Mayer-Vietoris and coefficients"
    prereqs: ["at1-08", "aa-06"]
    resources: ["Hatcher 2.2"]
    hook: "The long exact sequence: an algebraic machine that computes the homology of a whole from its overlapping parts."
    mission_link: "Mayer-Vietoris and the coefficient choice (aa-06's fields vs rings) are exactly what TDA fixes when it picks F_2."
  - id: at1-10
    module: at1
    title: "The formal viewpoint: axioms and functoriality"
    prereqs: ["at1-09", "aa-08"]
    resources: ["Hatcher 2.3"]
    hook: "Forget the construction — homology is pinned down by a handful of axioms, and it is a FUNCTOR."
    mission_link: "Homology as a functor Top -> Ab is what makes persistence a functor too — the bridge to cat and tda1."

  # ---- Category Theory Essentials (Aluffi Chapter 0 + Spivak; deepens aa's 'category of -') ----
  # Aluffi threads category theory (categories I.3-I.5, functors VIII.1); Spivak systematises limits/adjunctions.
  - id: cat-01
    module: cat
    title: "Categories and morphisms"
    prereqs: ["aa-07"]
    resources: ["Aluffi Chapter 0 I.3-I.4"]
    hook: "Stop looking inside objects; study only the arrows between them. Everything from aa-07 was rehearsal for this."
    mission_link: "Persistence lives in a category — objects are homology groups, arrows are the maps a filtration induces."
  - id: cat-02
    module: cat
    title: "Universal properties; products and coproducts"
    prereqs: ["cat-01", "aa-15"]
    resources: ["Aluffi Chapter 0 I.5"]
    hook: "Define a thing by the one property only it satisfies — no construction, just a diagram nothing else fits."
    mission_link: "Direct sums of persistence modules (aa-15's category of modules) are a universal property — how barcodes combine."
  - id: cat-03
    module: cat
    title: "Functors"
    prereqs: ["cat-02", "aa-08"]
    resources: ["Aluffi Chapter 0 VIII.1", "Spivak"]
    hook: "A map between whole categories that respects arrows — the grown-up form of aa-08's homomorphisms."
    mission_link: "Homology is a functor; so is 'sample the filtration at level t'. Persistence composes the two."
  - id: cat-04
    module: cat
    title: "Natural transformations and the Yoneda lemma"
    prereqs: ["cat-03"]
    resources: ["Aluffi Chapter 0 VIII.1", "Spivak"]
    hook: "A map between functors — and Yoneda's startling claim that an object is completely known by its arrows."
    mission_link: "Interleavings between persistence modules ARE natural transformations — this is stability's native language."
  - id: cat-05
    module: cat
    title: "Limits and colimits"
    prereqs: ["cat-04"]
    resources: ["Spivak", "Aluffi Chapter 0 I.5"]
    hook: "Products, quotients, gluings, intersections — all one construction (a limit) seen from the right height."
    mission_link: "The limit/colimit view unifies the quotient and gluing moves from la, aa, and top into a single idea."
  - id: cat-06
    module: cat
    title: "Adjunctions"
    prereqs: ["cat-05"]
    resources: ["Aluffi Chapter 0 VIII.1", "Spivak"]
    hook: "The idea category theory is built around: two functors in perfect balance. Free constructions are left adjoints."
    mission_link: "Adjunctions organise the constructions (free complex, geometric realisation) that turn data into topology."
  - id: cat-07
    module: cat
    title: "Homology and persistence as functors"
    prereqs: ["cat-06", "at1-10"]
    resources: ["Oudot ch. 1", "Spivak"]
    hook: "Cash it all in: a persistence module is a functor from a poset, and taking its barcode is a change of category."
    mission_link: "The categorical statement of the mission — persistence is a functor, and stability is a natural one."

  # ---- TDA I (Edelsbrunner-Harer + Oudot; the THEORY behind the lab's computation) ----
  # Pins verified against both TOCs. Boundary with 'lab': lab computes, tda1 proves.
  - id: tda1-01
    module: tda1
    title: "Simplicial complexes and filtrations"
    prereqs: ["at1-07", "lab-02", "top-13"]
    resources: ["Edelsbrunner III.1", "Oudot ch. 2"]
    hook: "A single space grows as you turn a dial — the filtration — and topology appears and vanishes as it does."
    mission_link: "The filtration is the input to everything; persistence studies how homology changes along it."
  - id: tda1-02
    module: tda1
    title: "Homology by matrix reduction"
    prereqs: ["at1-08", "la-07"]
    resources: ["Edelsbrunner IV.1-IV.2"]
    hook: "Homology as pure linear algebra over F_2: one Gaussian elimination on the boundary matrix (la-07, cashed in)."
    mission_link: "The computational-topology view of at1's homology — the exact operation the persistence algorithm iterates."
  - id: tda1-03
    module: tda1
    title: "Persistent homology and the persistence module"
    prereqs: ["tda1-01", "tda1-02"]
    resources: ["Edelsbrunner VII.1", "Oudot ch. 1"]
    hook: "Track a hole from the level it is born to the level it dies — persistence is homology with a lifespan."
    mission_link: "The persistence module — one vector space per level, one map per step — is the mission's central algebraic object."
  - id: tda1-04
    module: tda1
    title: "The structure theorem: interval decomposition and barcodes"
    prereqs: ["tda1-03", "aa-20"]
    resources: ["Oudot ch. 1"]
    hook: "Every persistence module shatters uniquely into intervals — and aa-20 is why. The barcode is a theorem, not a picture."
    mission_link: "aa-20 (f.g. modules over a PID) applied to k[t]-modules IS the barcode decomposition — the summit link of the whole degree."
  - id: tda1-05
    module: tda1
    title: "Persistence diagrams and their space"
    prereqs: ["tda1-04", "an2-01", "lab-04"]
    resources: ["Oudot ch. 1", "Edelsbrunner VII"]
    hook: "Replot each interval as a point above the diagonal — the persistence diagram, a multiset you can do geometry on."
    mission_link: "Diagram space is the metric space (an2-01) where stability is stated; lab-04 computed these, here they are defined."
  - id: tda1-06
    module: tda1
    title: "Metrics on diagrams: bottleneck and interleaving"
    prereqs: ["tda1-05", "an2-03"]
    resources: ["Oudot ch. 3", "Edelsbrunner VIII"]
    hook: "How far apart are two diagrams? Match points optimally (bottleneck) — or compare the modules directly (interleaving)."
    mission_link: "The interleaving distance is the algebraic metric; bottleneck is its geometric shadow — stability relates them."
  - id: tda1-07
    module: tda1
    title: "The stability theorem"
    prereqs: ["tda1-06", "an2-05", "pw-04"]
    resources: ["Oudot ch. 3", "Edelsbrunner VIII.2"]
    hook: "Perturb the data by epsilon, the diagram moves by at most epsilon. The theorem that makes TDA a science, proven. (pw-04's craft.)"
    mission_link: "Stability (the Isometry Theorem) is why persistence is trustworthy on noisy data — the mission's keystone theorem."
  - id: tda1-08
    module: tda1
    title: "Morse theory and sublevel-set persistence"
    prereqs: ["tda1-03", "an2-09", "an-12"]
    resources: ["Edelsbrunner VI", "Edelsbrunner VII"]
    hook: "Watch the sublevel sets of a function fill up; topology only changes at critical points (an-12's derivatives return)."
    mission_link: "Sublevel-set persistence links Morse theory to filtrations — how a scalar field becomes a barcode."
  - id: tda1-09
    module: tda1
    title: "The persistence algorithm and duality"
    prereqs: ["tda1-03", "lab-03", "at1-09"]
    resources: ["Edelsbrunner VII.2", "Edelsbrunner IV.4"]
    hook: "The full algorithm, with its clever pairing and cohomological speed-up — why Ripser (lab-03) is so fast."
    mission_link: "The theory behind the tool: the reduction algorithm's correctness and the duality that makes it efficient."
