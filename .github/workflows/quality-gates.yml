name: MathUni quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-base-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require pull requests to target main
        env:
          BASE_REF: ${{ github.base_ref }}
        run: test "$BASE_REF" = main

  curriculum-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # Without this the step fails outright: `cache: pip` globs for
          # requirements.txt / pyproject.toml, and this repo has neither —
          # only requirements-dev.txt. Every run of this workflow, on every
          # branch including main, has been failing at setup since it landed,
          # so none of the gates below has ever actually executed.
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate_syllabus.py
      - run: python scripts/validate_syllabus.py --selftest
      - run: python scripts/check_id_consistency.py
      - run: python scripts/lesson_lint.py --selftest
      - name: Lint the committed lesson corpus (obs 150)
        # lesson_lint.py was only ever invoked with an explicit path or via
        # --selftest, so it never re-validated the lessons already on disk
        # when it landed — a lesson nobody regenerates is a lesson nobody
        # checks. This ran non-blocking while six pre-existing lessons failed;
        # PR #11 repaired those and la-01's Markdown leaks are fixed here, so
        # the whole corpus now passes and this is a hard gate as intended.
        run: |
          status=0
          for f in lessons/*/*.html; do
            echo "--- $f ---"
            python scripts/lesson_lint.py "$f" || status=1
          done
          exit "$status"
      - run: python scripts/gate.py --selftest
      - name: Gates 4-6 over the committed lesson corpus
        # gate.py, mission.py and pull.py lived in a session scratchpad from S3
        # until 2026-08-21, copied forward by hand; the S2 plan records their
        # promotion as "deferred three times". Run over all 81 lessons for the
        # first time, gates 4-6 failed five — three of them a false positive in
        # the gate itself (an svg xmlns read as an external request) and two a
        # real stray </p>. Both are repaired here, so this lands as a hard gate
        # rather than as another non-blocking step waiting on a repair.
        run: |
          status=0
          for f in lessons/*/*.html; do
            echo "--- $f ---"
            python scripts/gate.py "$f" || status=1
          done
          exit "$status"
      - run: python scripts/mission.py --selftest
      - name: Gate 8 — mission strips quoted verbatim, against the drift ratchet
        # 15 of 81 lessons do not yet quote their mission_link verbatim; the S2
        # plan had recorded three, which was the sample rather than the
        # population. curriculum/mission-drift.txt names all 15 and why. They
        # are excused BY NAME and every other lesson is held, so no new lesson
        # can drift. The list is a ratchet, not a suppression:
        #   * a listed unit that starts passing fails this step until struck off
        #     — the state a plain allowlist is silent about;
        #   * a listed unit whose lesson is gone fails it;
        #   * and --baseline fails it when the list has GROWN since the base
        #     ref. Without that third rule the first two only ever let the list
        #     shrink while nothing stopped it growing, so "can only shrink" was
        #     a claim about author discipline rather than a property of the
        #     gate. Found by the Codex review of PR #20.
        # The baseline is fetched from the PR's base branch; on a push to main
        # HEAD~1 stands in. If the file does not exist there — the commit that
        # introduces the list — mission.py says so rather than treating the
        # absent baseline as an empty one.
        run: |
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          git fetch --depth=2 origin "$base" 2>/dev/null || true
          git show "$base:curriculum/mission-drift.txt" > /tmp/drift-baseline.txt \
            2>/dev/null || rm -f /tmp/drift-baseline.txt
          python scripts/mission.py \
            --known-failing curriculum/mission-drift.txt \
            --baseline /tmp/drift-baseline.txt \
            lessons/*/*.html
      - name: Structure of the lab sets (gate 9, the half CI can run)
        # The full gate re-executes every block and diffs its stdout, which
        # needs the pinned 3.11 lab interpreter this runner does not have —
        # giotto-tda publishes no wheel for 3.13. What does not need it is the
        # structural half: every code block paired with a recorded output, no
        # duplicate ids, no contradictory pins, and an env block that imports
        # every module the set uses. That runs here. Re-execution stays a
        # local command against the pinned interpreter, and is recorded as
        # such in the plan rather than described as enforced.
        run: |
          status=0
          for f in problems/sets/lab-*.md; do
            echo "--- $f ---"
            python scripts/check_lab_outputs.py "$f" --parse-only || status=1
          done
          exit "$status"
      - run: python -m pytest -q
