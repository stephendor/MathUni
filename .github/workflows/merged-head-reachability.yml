name: Merged head reachability

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove every merged PR head reached main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_merged_reachability.py
